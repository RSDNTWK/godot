<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-start {
	display: none;
	align-items: center;
	flex-direction: column;
	gap: 1rem;
	z-index: 1;
}

#status-start-button, #status-reload-button {
	background: #f4f0e6;
	border: 1px solid #f4f0e6;
	border-radius: 0.5rem;
	color: #111111;
	cursor: pointer;
	font-size: 1.1rem;
	font-weight: 700;
	padding: 0.85rem 1.75rem;
}

#status-start-button:focus-visible, #status-reload-button:focus-visible {
	outline: 2px solid #ffffff;
	outline-offset: 2px;
}

#status-start-label {
	color: #f4f0e6;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.95rem;
	text-align: center;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#status-message {
	white-space: pre-line;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status" data-engine-url="$GODOT_URL">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div id="status-start">
				<button id="status-start-button" type="button">Start Game</button>
			</div>
			<progress id="status-progress"></progress>
			<div id="status-notice" role="status">
				<p id="status-message"></p>
				<button id="status-reload-button" type="button" hidden>Reload Page</button>
			</div>
		</div>

		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusStart = document.getElementById('status-start');
	const statusStartButton = document.getElementById('status-start-button');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusMessage = document.getElementById('status-message');
	const statusReloadButton = document.getElementById('status-reload-button');
	statusReloadButton.addEventListener('click', () => window.location.reload());

	let initializing = true;
	let statusMode = '';
	let gameStartRequested = false;

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusStart.style.display = mode === 'start' ? 'flex' : 'none';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' || mode === 'loading' ? 'block' : 'none';
		statusReloadButton.hidden = mode !== 'notice';
		statusMode = mode;
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			statusMessage.textContent = err.message;
		} else if (typeof err === 'string') {
			statusMessage.textContent = err;
		} else {
			statusMessage.textContent = 'An unknown error occurred.';
		}
		setStatusMode('notice');
		initializing = false;
	}

	let releaseProfile = null;

	function closeProfile() {
		delete window.ToIProfileStorage;
		if (releaseProfile) {
			releaseProfile();
			releaseProfile = null;
		}
	}

	function startGame(engine) {
		if (gameStartRequested || !initializing) {
			return;
		}
		gameStartRequested = true;
		statusStartButton.disabled = true;
		setStatusMode('progress');
		const fail = (error) => {
			closeProfile();
			displayFailureNotice(error);
		};
		try {
			// Start directly from the user's click so the browser can enable audio.
			engine.startGame({
				'onExit': closeProfile,
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			}).then(() => {
				setStatusMode('hidden');
			}, fail);
		} catch (error) {
			fail(error);
		}
	}

	function prepareStartButton(engine) {
		if (!navigator.locks || typeof engine.writePersistentProfile !== 'function') {
			displayFailureNotice('The game needs a current browser and working site storage. Open it over HTTPS and try again.');
			return;
		}
		// The mounted browser filesystem belongs to one engine at a time.
		// Acquire before showing Start and release after the final flush on exit.
		navigator.locks.request('toi-browser-profile', { ifAvailable: true }, (lock) => {
			if (!lock) {
				throw new Error('The game is already open in another tab. Close that tab and reload this page.');
			}
			return new Promise((release) => {
				releaseProfile = release;
				window.ToIProfileStorage = {
					save: (paths, stage, done) => {
						Promise.resolve().then(() => engine.writePersistentProfile(JSON.parse(paths), stage)).then(() => done(true), (error) => {
							console.error(error);
							done(false);
						});
					},
				};
				setStatusMode('start');
				statusStartButton.addEventListener('click', () => startGame(engine), { once: true });
			});
		}).catch(displayFailureNotice);
	}

	function initializeEngine() {
		if (typeof Engine !== 'function') {
			displayFailureNotice('The game engine did not initialize. Reload the page to try again.');
			return;
		}

		const engine = new Engine(GODOT_CONFIG);
		const missing = Engine.getMissingFeatures({
			threads: GODOT_THREADS_ENABLED,
		});
		if (missing.length === 0) {
			prepareStartButton(engine);
			return;
		}
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve, reject) => {
					setTimeout(() => reject(new Error('Service worker registration timed out.')), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch(displayFailureNotice);
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	}

	statusMessage.textContent = 'Loading the game engine…';
	setStatusMode('loading');
	const loader = document.createElement('script');
	loader.src = statusOverlay.dataset.engineUrl;
	const loadTimer = setTimeout(() => {
		loader.remove();
		displayFailureNotice('Timed out loading the game engine. Reload the page to try again.');
	}, 30000);
	loader.addEventListener('load', () => {
		clearTimeout(loadTimer);
		if (initializing) {
			try {
				initializeEngine();
			} catch (err) {
				displayFailureNotice(err);
			}
		}
	}, { once: true });
	loader.addEventListener('error', () => {
		clearTimeout(loadTimer);
		if (initializing) {
			displayFailureNotice('The game engine could not be downloaded. Reload the page to try again.');
		}
	}, { once: true });
	document.head.appendChild(loader);
}());
		</script>
	</body>
</html>
